
name: StudyFlow Automated Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run automated tests
        run: dotnet test StudyFlow.Tests/StudyFlow.Tests.csproj --configuration Release
